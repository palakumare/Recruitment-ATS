spring.application.name=Recruitment and Applicant Tracking System
server.port=8080

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Active Profile: dev (Uses persistent file-based storage with MySQL syntax compatibility)
# Set to 'mysql' to use standard local MySQL 8.0 service
spring.profiles.active=dev

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
