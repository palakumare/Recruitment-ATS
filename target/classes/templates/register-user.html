<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-header('Candidate Registration - Recruitment and Applicant Tracking System')}"></head>
<body class="bg-light">

    <!-- Top Navigation -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                
                <!-- Feedback Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="custom-card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="custom-card-header bg-white py-4 border-bottom text-center">
                        <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle p-3 shadow-sm mb-2">
                            <i class="fa-solid fa-user-plus fs-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Candidate Registration</h3>
                        <p class="text-muted small mb-0">Create your candidate profile to apply for premier tech opportunities</p>
                        <div class="badge bg-danger-subtle text-danger mt-2 py-1 px-3 rounded-pill fw-semibold small">
                            * All registration fields are mandatory
                        </div>
                    </div>

                    <div class="custom-card-body p-4 p-md-5">
                        <form th:action="@{/register-user}" th:object="${userDto}" method="post" enctype="multipart/form-data">
                            
                            <div class="row g-3">
                                <!-- Full Name -->
                                <div class="col-md-6">
                                    <label for="name" class="form-label fw-semibold small text-muted">Full Name <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-regular fa-user"></i></span>
                                        <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Username -->
                                <div class="col-md-6">
                                    <label for="username" class="form-label fw-semibold small text-muted">Username <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-at"></i></span>
                                        <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="e.g. rahul_s" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Email ID -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold small text-muted">Email ID <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-regular fa-envelope"></i></span>
                                        <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="e.g. rahul@example.com" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Mobile Number -->
                                <div class="col-md-6">
                                    <label for="mobile" class="form-label fw-semibold small text-muted">Mobile Number (10 Digits) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-phone"></i></span>
                                        <input type="tel" th:field="*{mobile}" id="mobile" maxlength="10" pattern="[0-9]{10}" class="form-control" placeholder="e.g. 9876543210" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Experience -->
                                <div class="col-md-4">
                                    <label for="experience" class="form-label fw-semibold small text-muted">Experience (Years) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-briefcase"></i></span>
                                        <input type="number" step="0.5" min="0" max="40" th:field="*{experience}" id="experience" class="form-control" placeholder="e.g. 3.5" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Gender -->
                                <div class="col-md-4">
                                    <label for="gender" class="form-label fw-semibold small text-muted">Gender <span class="text-danger">*</span></label>
                                    <select th:field="*{gender}" id="gender" class="form-select" required>
                                        <option value="">-- Select Gender --</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Age -->
                                <div class="col-md-4">
                                    <label for="age" class="form-label fw-semibold small text-muted">Age <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-cake-candles"></i></span>
                                        <input type="number" min="18" max="75" th:field="*{age}" id="age" class="form-control" placeholder="e.g. 25" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Location -->
                                <div class="col-md-6">
                                    <label for="location" class="form-label fw-semibold small text-muted">Current Location / City <span class="text-danger">*</span></label>
                                    <select th:field="*{location}" id="location" class="form-select" required>
                                        <option value="">-- Select City --</option>
                                        <option th:each="c : ${cities}" th:value="${c}" th:text="${c}">Nagpur</option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Resume Upload -->
                                <div class="col-md-6">
                                    <label for="resumeFile" class="form-label fw-semibold small text-muted">Resume Upload (PDF/DOC/DOCX) <span class="text-danger">*</span></label>
                                    <input type="file" th:field="*{resumeFile}" id="resumeFile" class="form-control" accept=".pdf,.doc,.docx" required>
                                    <div id="resumeFile-feedback" class="text-success small mt-1 d-none"></div>
                                    <div th:if="${#fields.hasErrors('resumeFile')}" th:errors="*{resumeFile}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Password -->
                                <div class="col-md-6">
                                    <label for="password" class="form-label fw-semibold small text-muted">Password <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" th:field="*{password}" id="password" minlength="6" class="form-control" placeholder="Min 6 characters" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label fw-semibold small text-muted">Re-enter Password <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" th:field="*{confirmPassword}" id="confirmPassword" minlength="6" class="form-control" placeholder="Re-type password" required>
                                    </div>
                                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger small mt-1"></div>
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm">
                                    <i class="fa-solid fa-check me-2"></i>Complete Candidate Registration
                                </button>
                            </div>

                            <div class="text-center mt-3 small text-muted">
                                Already registered? <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: common-footer}"></div>
</body>
</html>
