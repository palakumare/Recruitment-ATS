<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center gap-2">
            <!-- Sidebar toggle button for mobile -->
            <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button" id="sidebarToggle" aria-label="Toggle Navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark text-decoration-none m-0" th:href="@{/}">
                <span class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-2 shadow-sm" style="width: 36px; height: 36px;">
                    <i class="fa-solid fa-briefcase"></i>
                </span>
                <span class="fs-5 tracking-tight">Recruit<span class="text-primary">ATS</span></span>
            </a>
        </div>

        <div class="d-flex align-items-center gap-3">
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <div class="text-end d-none d-sm-block">
                    <div class="fw-bold text-dark small" sec:authentication="name">Username</div>
                    <span sec:authorize="hasRole('ADMIN')" class="brand-badge bg-primary-subtle text-primary border border-primary-subtle">Administrator</span>
                    <span sec:authorize="hasRole('HR')" class="brand-badge bg-info-subtle text-info-emphasis border border-info-subtle">HR Recruiter</span>
                    <span sec:authorize="hasRole('USER') and !hasRole('ADMIN')" class="brand-badge bg-success-subtle text-success border border-success-subtle">Candidate</span>
                </div>

                <div class="dropdown">
                    <button class="btn btn-light rounded-circle p-2 shadow-sm border" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 40px; height: 40px;">
                        <i class="fa-solid fa-user-tie text-secondary"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 rounded-3">
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item py-2" th:href="@{/admin/dashboard}"><i class="fa-solid fa-shield-halved me-2 text-primary"></i>Admin Dashboard</a></li>
                        <li sec:authorize="hasRole('HR')"><a class="dropdown-item py-2" th:href="@{/hr/dashboard}"><i class="fa-solid fa-building me-2 text-info"></i>HR Dashboard</a></li>
                        <li sec:authorize="hasRole('USER')"><a class="dropdown-item py-2" th:href="@{/user/dashboard}"><i class="fa-solid fa-user me-2 text-success"></i>Candidate Dashboard</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item py-2 text-danger">
                                    <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

            <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-outline-primary btn-sm px-3 fw-semibold rounded-pill">Log In</a>
                <a th:href="@{/register-user}" class="btn btn-primary btn-sm px-3 fw-semibold rounded-pill shadow-sm">Register</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
