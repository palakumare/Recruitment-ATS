<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-header('HR Profile - ATS')}"></head>
<body>

    <!-- Top Navigation -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('profile', 'hr')}"></div>

        <!-- Main Content Area -->
        <main class="app-content">
            <div class="container-fluid p-0">
                
                <!-- Feedback Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h2 class="fw-bold mb-1">Company HR Profile</h2>
                        <p class="text-muted small mb-0">Manage your recruiter identity, corporate organization details, and security.</p>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Left: HR Profile Form -->
                    <div class="col-lg-8">
                        <div class="custom-card">
                            <div class="custom-card-header">
                                <h5 class="fw-bold mb-0"><i class="fa-solid fa-building me-2 text-info"></i>Recruiter & Organization Profile</h5>
                            </div>
                            <div class="custom-card-body">
                                <form th:action="@{/hr/profile}" th:object="${profileDto}" method="post">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="name" class="form-label fw-semibold small text-muted">Full Name</label>
                                            <input type="text" th:field="*{name}" id="name" class="form-control" required>
                                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="username" class="form-label fw-semibold small text-muted">Username</label>
                                            <input type="text" th:field="*{username}" id="username" class="form-control" required>
                                            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger small mt-1"></div>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="email" class="form-label fw-semibold small text-muted">Official Email ID</label>
                                            <input type="email" th:field="*{email}" id="email" class="form-control" required>
                                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="mobile" class="form-label fw-semibold small text-muted">Mobile Number</label>
                                            <input type="tel" th:field="*{mobile}" id="mobile" maxlength="10" pattern="[0-9]{10}" class="form-control" required>
                                            <div th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="text-danger small mt-1"></div>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="companyName" class="form-label fw-semibold small text-muted">Company / Organization Name</label>
                                            <input type="text" th:field="*{companyName}" id="companyName" class="form-control" required>
                                            <div th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}" class="text-danger small mt-1"></div>
                                        </div>

                                        <div class="col-md-3">
                                            <label for="gender" class="form-label fw-semibold small text-muted">Gender</label>
                                            <select th:field="*{gender}" id="gender" class="form-select" required>
                                                <option value="Male">Male</option>
                                                <option value="Female">Female</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>

                                        <div class="col-md-3">
                                            <label for="location" class="form-label fw-semibold small text-muted">Location</label>
                                            <select th:field="*{location}" id="location" class="form-select" required>
                                                <option th:each="c : ${cities}" th:value="${c}" th:text="${c}">Pune</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mt-4 pt-3 border-top text-end">
                                        <button type="submit" class="btn btn-info text-white px-4 fw-semibold rounded-pill">
                                            <i class="fa-solid fa-floppy-disk me-2"></i>Save HR Profile
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Password Management -->
                    <div class="col-lg-4">
                        <div class="custom-card">
                            <div class="custom-card-header">
                                <h5 class="fw-bold mb-0"><i class="fa-solid fa-shield-halved me-2 text-warning"></i>Security Credentials</h5>
                            </div>
                            <div class="custom-card-body">
                                <form th:action="@{/hr/profile/password}" th:object="${passwordDto}" method="post">
                                    <div class="mb-3">
                                        <label for="currentPassword" class="form-label fw-semibold small text-muted">Current Password</label>
                                        <input type="password" th:field="*{currentPassword}" id="currentPassword" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label fw-semibold small text-muted">New Password</label>
                                        <input type="password" th:field="*{newPassword}" id="newPassword" minlength="6" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmNewPassword" class="form-label fw-semibold small text-muted">Confirm New Password</label>
                                        <input type="password" th:field="*{confirmNewPassword}" id="confirmNewPassword" minlength="6" class="form-control" required>
                                    </div>
                                    <button type="submit" class="btn btn-outline-info btn-sm w-100 fw-semibold rounded-pill">
                                        <i class="fa-solid fa-key me-1"></i>Change Password
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: common-footer}"></div>
</body>
</html>
