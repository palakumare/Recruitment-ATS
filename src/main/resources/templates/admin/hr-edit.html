<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-header('Edit HR Profile - Admin Console')}"></head>
<body>

    <!-- Top Navigation -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('hr', 'admin')}"></div>

        <!-- Main Content Area -->
        <main class="app-content">
            <div class="container-fluid p-0">
                
                <!-- Feedback Alerts -->
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="mb-3">
                    <a th:href="@{/admin/hr}" class="text-muted text-decoration-none small">
                        <i class="fa-solid fa-arrow-left me-1"></i>Back to HR List
                    </a>
                </div>

                <div class="custom-card shadow-sm">
                    <div class="custom-card-header bg-white py-3">
                        <h4 class="fw-bold mb-0 text-dark">
                            <i class="fa-solid fa-pen-to-square me-2 text-info"></i>Edit HR Recruiter Account
                        </h4>
                    </div>

                    <div class="custom-card-body p-4">
                        <form th:action="@{'/admin/hr/' + ${hr.id} + '/edit'}" th:object="${profileDto}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label fw-semibold small text-muted">Full Name</label>
                                    <input type="text" th:field="*{name}" id="name" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="username" class="form-label fw-semibold small text-muted">Username</label>
                                    <input type="text" th:field="*{username}" id="username" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold small text-muted">Email ID</label>
                                    <input type="email" th:field="*{email}" id="email" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="mobile" class="form-label fw-semibold small text-muted">Mobile Number</label>
                                    <input type="tel" th:field="*{mobile}" id="mobile" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="companyName" class="form-label fw-semibold small text-muted">Company Name</label>
                                    <input type="text" th:field="*{companyName}" id="companyName" class="form-control" required>
                                </div>

                                <div class="col-md-3">
                                    <label for="gender" class="form-label fw-semibold small text-muted">Gender</label>
                                    <select th:field="*{gender}" id="gender" class="form-select" required>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label for="location" class="form-label fw-semibold small text-muted">Location</label>
                                    <select th:field="*{location}" id="location" class="form-select" required>
                                        <option th:each="c : ${cities}" th:value="${c}" th:text="${c}">Pune</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top text-end">
                                <a th:href="@{/admin/hr}" class="btn btn-outline-secondary px-3 rounded-pill me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom px-4 fw-semibold rounded-pill">
                                    <i class="fa-solid fa-floppy-disk me-2"></i>Save HR Account
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: common-footer}"></div>
</body>
</html>
